name: ACEest Fitness CI/CD

on:
  push:
  pull_request:

jobs:
  build-lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness:${{ github.sha }} .

  automated-testing:
    name: Automated Testing
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: |
          docker build -t aceest-fitness:test .

      - name: Run Pytest inside container
        run: |
          docker run --rm aceest-fitness:test python -m pytest -v