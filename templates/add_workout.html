{% extends "base.html" %}

{% block title %}Add Workout | ACEest Fitness & Gym{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">

        <span class="section-label">WORKOUTS</span>

        <h1>Record a Workout</h1>

        <p>
            Add a workout activity to the fitness management system.
        </p>

    </div>


    <div class="form-card">

        {% if error %}

        <div class="alert">
            ⚠ {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-grid">

                <div class="form-group full-width">

                    <label for="name">Workout Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Treadmill Running"
                        value="{{ form.get('name', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="duration">
                        Duration (minutes)
                    </label>

                    <input
                        type="number"
                        id="duration"
                        name="duration"
                        placeholder="e.g. 45"
                        value="{{ form.get('duration', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="calories">
                        Calories Burned
                    </label>

                    <input
                        type="number"
                        id="calories"
                        name="calories"
                        placeholder="e.g. 350"
                        value="{{ form.get('calories', '') }}"
                        required
                    >

                </div>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('view_workouts') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    Save Workout
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
