{% extends "base.html" %}

{% block title %}Register Member | ACEest Fitness & Gym{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">

        <span class="section-label">MEMBERS</span>

        <h1>Register New Member</h1>

        <p>
            Add a new member to the ACEest Fitness & Gym management system.
        </p>

    </div>


    <div class="form-card">

        {% if error %}

        <div class="alert">
            ⚠ {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-grid">

                <div class="form-group full-width">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter member name"
                        value="{{ form.get('name', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="e.g. 25"
                        value="{{ form.get('age', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="weight">Weight (kg)</label>

                    <input
                        type="number"
                        step="0.1"
                        id="weight"
                        name="weight"
                        placeholder="e.g. 72.5"
                        value="{{ form.get('weight', '') }}"
                        required
                    >

                </div>


                <div class="form-group full-width">

                    <label for="goal">Fitness Goal</label>

                    <select id="goal" name="goal" required>

                        <option value="">Select a goal</option>

                        <option value="Weight Loss"
                            {% if form.get('goal') == 'Weight Loss' %}selected{% endif %}>
                            Weight Loss
                        </option>

                        <option value="Muscle Gain"
                            {% if form.get('goal') == 'Muscle Gain' %}selected{% endif %}>
                            Muscle Gain
                        </option>

                        <option value="General Fitness"
                            {% if form.get('goal') == 'General Fitness' %}selected{% endif %}>
                            General Fitness
                        </option>

                        <option value="Strength"
                            {% if form.get('goal') == 'Strength' %}selected{% endif %}>
                            Strength
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('view_members') }}" class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Register Member
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
